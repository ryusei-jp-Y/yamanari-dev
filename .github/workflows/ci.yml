name: CI

on:
  pull_request:
  push:
    branches:
      - main

# 同一ブランチで新しい push があれば進行中の古いランを打ち切る（Actions 分の節約）。
# main は打ち切らない。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check static pages
        run: bash scripts/check-static-site.sh
